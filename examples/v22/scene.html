<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#000;font-family:Inter,"Apple Color Emoji",sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#0a1222,#05070d)}
#glow{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 58%,var(--g,#333) 0%,transparent 55%)}
#vign{position:absolute;inset:0;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.8) 100%);z-index:50}
#grain{position:absolute;inset:0;z-index:51;opacity:.07;background-image:repeating-radial-gradient(circle at 17% 32%,#fff 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
.pt{position:absolute;font-size:32px}
#sub{position:absolute;top:56px;left:0;right:0;text-align:center;font-weight:900;font-size:50px;color:#fff;z-index:40;text-shadow:0 4px 24px rgba(0,0,0,.7);padding:0 50px;line-height:1.12;text-transform:uppercase}
#sub span{display:inline-block;margin:0 10px}
.card{position:absolute;left:50%;top:57%;width:600px;height:690px;margin-left:-300px;margin-top:-345px;border-radius:52px;overflow:hidden;opacity:0;box-shadow:0 40px 120px rgba(0,0,0,.8),0 0 0 1.5px rgba(255,255,255,.08) inset;background:#111214;color:#fff}
.hdr{font-size:22px;font-weight:600;color:rgba(255,255,255,.55);padding:34px 40px 0}
.ttl{font-size:46px;font-weight:800;padding:6px 40px 0;letter-spacing:-1px}
.c{position:absolute;left:0;right:0;text-align:center}
.mono{font-family:'JetBrains Mono'}
.box{background:#2c2c2e;border-radius:24px;padding:20px 24px}
.bub{display:inline-block;padding:14px 22px;border-radius:28px;font-size:27px;font-weight:500}
.row{display:flex;align-items:center;gap:18px;background:#1c1c1e;border-radius:22px;padding:16px 22px;margin-bottom:12px;font-size:26px;font-weight:700}
.tg{width:84px;height:50px;border-radius:25px;background:#3a3a3c;position:relative;flex:none;margin-left:auto}.tg b{position:absolute;top:4px;left:4px;width:42px;height:42px;border-radius:50%;background:#fff}
#fade{position:absolute;inset:0;background:#000;opacity:0;z-index:70}
.ch{position:absolute;width:200px;height:300px;transform-origin:100px 290px;z-index:5}
</style></head><body><div id="stage"><div id="glow"></div><div id="pts"></div>

<div class="card" id="c1" style="background:linear-gradient(180deg,#5aa8e8 0%,#9fd3ff 45%,#4caf50 46%,#2e7d32 100%)">
 <div style="padding:30px 36px 0;color:#fff"><div style="font-size:28px;font-weight:600">Луг</div><div style="font-size:80px;font-weight:200;line-height:1">☀️ 24°</div></div>
 <div id="fl1" style="position:absolute;inset:0"></div>
 <div class="ch" data-p="a"></div><div class="ch" data-p="b"></div><div class="ch" data-p="c"></div>
 <div style="position:absolute;left:24px;right:24px;bottom:24px;background:rgba(0,0,0,.35);border-radius:24px;padding:16px 22px;color:#fff;font-size:24px;font-weight:800">🐰 Тусовка зайцев · <span id="cnt1">0</span> рядом</div>
</div>
<div class="card" id="c2" style="background:linear-gradient(180deg,#2a0a3a,#0a0410)">
 <div class="hdr" style="color:#bf5af2">Музыка · сейчас играет</div>
 <div style="position:absolute;left:40px;top:80px;font-size:34px;font-weight:900">Праздничный бит</div>
 <div id="bpm2" class="mono" style="position:absolute;right:40px;top:84px;font-size:26px;font-weight:800;color:#bf5af2">0 BPM</div>
 <div id="eq2" style="position:absolute;left:40px;right:40px;top:130px;height:120px;display:flex;align-items:flex-end;opacity:.8;gap:8px"></div>
 <div class="ch" data-p="d"></div>
 <div id="cl2" class="c" style="bottom:30px;font-size:24px;font-weight:800;color:#d0a0ff">хлопков ушами: 0</div>
</div>
<div class="card" id="c3" style="background:#1c1c1e">
 <div style="position:absolute;left:30px;right:30px;top:30px;border-left:8px solid #ff9f0a;background:#2c2c2e;border-radius:20px;padding:18px 22px">
  <div style="font-size:20px;color:#ff9f0a;font-weight:800">Приглашение · сегодня</div><div style="font-size:42px;font-weight:900">🎉 PARTY</div>
  <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:22px;font-weight:700"><span>пойдут:</span><span id="go3" class="mono" style="color:#30d158">0</span></div></div>
 <div class="ch" data-p="e"></div><div class="ch" data-p="f"></div><div class="ch" data-p="g"></div>
 <div id="ball3" style="position:absolute;left:250px;top:200px;font-size:100px;opacity:0">🪩</div>
</div>
<div class="card" id="c4" style="background:radial-gradient(circle at 50% 40%,#4a3a0a,#0c0a02)">
 <div id="sp4" style="position:absolute;inset:0"></div>
 <div style="position:absolute;left:30px;right:30px;top:30px;background:rgba(0,0,0,.4);border-radius:24px;padding:16px 20px;display:flex;gap:16px;align-items:center">
  <div style="width:72px;height:72px;border-radius:16px;background:linear-gradient(135deg,#ffd6e8,#ff8ac4);display:flex;align-items:center;justify-content:center;font-size:44px">🐰</div>
  <div><div style="font-size:28px;font-weight:900">Песня Шнуфеля</div><div id="gl4" style="font-size:22px;font-weight:800;color:#8e8e93">качество: обычное</div></div></div>
 <div class="ch" data-p="h"></div>
</div>
<div id="sub"></div><div id="vign"></div><div id="grain"></div><div id="fade"></div></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eb=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pop=(t,s,k=8)=>t>=s?Math.exp(-(t-s)*k):0;
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const tog=(id,on)=>{const e=$(id);e.style.background=on?'#30d158':'#3a3a3c';e.firstElementChild.style.left=on?'38px':'4px'};
const LINES=[[["и", 0.0], ["на", 0.5], ["лугу", 0.8], ["резвится", 1.5], ["тусовка", 2.6], ["зайцев,", 3.7]], [["ушами", 4.4], ["хлопая", 5.4], ["под", 6.1], ["праздничный", 6.5], ["бит", 7.5]], [["сегодня", 8.8], ["party,", 9.5], ["все", 10.6], ["хотят", 10.9], ["потусоваться", 11.9]], [["и", 13.2], ["песня", 13.6], ["Шнуфеля", 14.3], ["гламурно", 14.9], ["звучит", 15.9]]];const SC=[[-0.3, 4.3], [4.3, 8.6], [8.6, 13.05], [13.05, 99]];const GLOW=["#1a5c2e", "#5a1d7a", "#7a3a0a", "#7a6a10"];const PEMO=["🐰", "🎵", "🎉", "✨"];const END=[16.6, 17.0];const SUBFROM=-9;
const CH=(p,hat,j1,j2)=>`<svg viewBox="0 0 200 300" width="200" height="300" style="overflow:visible">
<defs><linearGradient id="${p}_jg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${j1}" id="${p}_s1"/><stop offset=".5" stop-color="${j2}" id="${p}_s2"/><stop offset="1" stop-color="${j2}" id="${p}_s3"/></linearGradient></defs>
<g id="${p}_all">
<g id="${p}_legL"><rect x="77" y="205" width="21" height="70" rx="10" fill="#26262e"/><ellipse cx="84" cy="280" rx="19" ry="10" fill="#fff"/></g>
<g id="${p}_legR"><rect x="102" y="205" width="21" height="70" rx="10" fill="#26262e"/><ellipse cx="116" cy="280" rx="19" ry="10" fill="#fff"/></g>
<g id="${p}_armL"><rect x="40" y="128" width="21" height="72" rx="10" fill="url(#${p}_jg)"/><circle cx="50" cy="202" r="10" fill="#f2c6a0"/></g>
<rect x="54" y="116" width="92" height="104" rx="32" fill="url(#${p}_jg)"/>
<path d="M58 150 H142 M58 182 H142" stroke="rgba(0,0,0,.16)" stroke-width="4"/>
<path d="M78 120 Q100 152 122 120" fill="none" stroke="#ffd60a" stroke-width="5"/><circle cx="100" cy="146" r="7" fill="#ffd60a"/>
<g id="${p}_armR"><rect x="139" y="128" width="21" height="72" rx="10" fill="url(#${p}_jg)"/><circle cx="150" cy="202" r="10" fill="#f2c6a0"/></g>
<g id="${p}_head"><circle cx="100" cy="80" r="42" fill="#f2c6a0"/>
<path d="M56 66 Q58 26 100 26 Q142 26 144 66 L162 72 Q100 54 38 72 Z" fill="${hat}"/>
<rect x="64" y="74" width="32" height="19" rx="9" fill="#111"/><rect x="104" y="74" width="32" height="19" rx="9" fill="#111"/><rect x="94" y="78" width="12" height="4" fill="#111"/>
<rect x="70" y="77" width="8" height="4" rx="2" fill="rgba(255,255,255,.5)"/><rect x="110" y="77" width="8" height="4" rx="2" fill="rgba(255,255,255,.5)"/>
<path id="${p}_mouth" d="M88 104 Q100 112 112 104" fill="none" stroke="#7a3a2a" stroke-width="4" stroke-linecap="round"/></g>
</g></svg>`;
function pose(p,o){const R=(id,a,x,y)=>$(p+'_'+id).setAttribute('transform',`rotate(${a||0} ${x} ${y})`);
 R('armL',o.aL,50,135);R('armR',o.aR,150,135);R('legL',o.lL,88,210);R('legR',o.lR,112,210);R('head',o.hd,100,110);
 $(p+'_all').setAttribute('transform',`translate(0 ${o.bob||0})`);
 $(p+'_mouth').setAttribute('d',o.open?'M86 102 Q100 122 114 102 Z':'M88 104 Q100 112 112 104');$(p+'_mouth').setAttribute('fill',o.open?'#7a2a2a':'none');}
function place(p,x,y,s,flip,rot){const e=$('ch_'+p);e.style.left=(x-100)+'px';e.style.top=(y-290)+'px';e.style.transform=`scale(${s*(flip?-1:1)},${s}) rotate(${rot||0}deg)`;}
const run=(t,f)=>{const q=Math.sin(t*f);return {lL:q*38,lR:-q*38,aL:-q*45,aR:-q*45,bob:-Math.abs(Math.cos(t*f))*8}};
const walk=(t,f)=>{const q=Math.sin(t*f);return {lL:q*22,lR:-q*22,aL:-q*20,aR:-q*20,bob:-Math.abs(Math.cos(t*f))*4}};

(function(){const C={b:['#ffd60a','#a0f0ff','#0a84ff'],c:['#30d158','#ffe27a','#ff9f0a'],f:['#ffd60a','#a0f0ff','#0a84ff'],g:['#30d158','#ffe27a','#ff9f0a']};
 document.querySelectorAll('.ch').forEach(e=>{const p=e.dataset.p;e.id='ch_'+p;e.innerHTML=CH(p,...(C[p]||['#64d2ff','#ff8ac4','#ff2d78']));
  const hd=document.getElementById(p+'_head');const ns='http://www.w3.org/2000/svg';
  ['L','R'].forEach((s,i)=>{const g=document.createElementNS(ns,'g');g.id=p+'_ear'+s;g.innerHTML=`<ellipse cx="${i?118:82}" cy="2" rx="13" ry="34" fill="#fff"/><ellipse cx="${i?118:82}" cy="6" rx="6" ry="24" fill="#ffb3cf"/>`;hd.insertBefore(g,hd.firstChild);});});
 let f='';for(let i=0;i<18;i++)f+=`<div style="position:absolute;left:${rnd(i)*560}px;top:${330+rnd(i+5)*300}px;font-size:${24+rnd(i+2)*14}px">${['🌼','🌷','🍀'][i%3]}</div>`;$('fl1').innerHTML=f;
 let q='';for(let i=0;i<20;i++)q+=`<div id="eq${i}" style="flex:1;border-radius:6px;background:linear-gradient(0deg,#bf5af2,#ff2d78)"></div>`;$('eq2').innerHTML=q;
 let s='';for(let i=0;i<40;i++)s+=`<div id="s4_${i}" style="position:absolute;left:${rnd(i)*580}px;top:${rnd(i+77)*670}px;font-size:${14+rnd(i+4)*26}px;color:#ffd60a">✦</div>`;$('sp4').innerHTML=s;})();
function ears(p,a){$(p+'_earL').setAttribute('transform',`rotate(${-a} 82 30)`);$(p+'_earR').setAttribute('transform',`rotate(${a} 118 30)`);}
function hop(t,ph){const q=Math.abs(Math.sin(t*5+ph));return{bob:-q*60,lL:-q*20,lR:q*20,aL:40*q,aR:-40*q,open:q>.6}}

(function(){let p='';for(let i=0;i<20;i++)p+=`<div class="pt" id="p${i}"></div>`;$('pts').innerHTML=p;})();
function sceneIdx(t){for(let i=SC.length-1;i>=0;i--)if(t>=SC[i][0])return i;return 0}
function showCard(i,t){const [a,b]=SC[i];const el=$('c'+(i+1));
 const inP=eo(seg(t,a,a+.25)),outP=i<SC.length-1?seg(t,b-.1,b):0;const s=lerp(.86,1,eb(seg(t,a,a+.3)))*(1+outP*.06);
 el.style.opacity=inP*(1-outP);el.style.transform=`scale(${s}) translateY(${(1-inP)*40}px)`;el.style.filter=`blur(${(1-inP)*14+outP*10}px)`;}
const shake=(id,t,s,amp=10)=>{if(t>=s)$(id).style.transform+=` translateX(${Math.sin(t*90)*amp*pop(t,s,6)}px)`};
function render(t){
 for(let i=1;i<=SC.length;i++)$('c'+i).style.opacity=0;
 const si=sceneIdx(t);showCard(si,t);
 $('glow').style.setProperty('--g',GLOW[si]);
 let lastW=-9;LINES.flat().forEach(([w,s])=>{if(s<=t)lastW=s});const pulse=Math.exp(-(t-lastW)*7);
 $('glow').style.opacity=.5+.4*pulse;$('glow').style.transform=`scale(${1+.04*pulse})`;
 for(let i=0;i<20;i++){const e=$('p'+i);const y=1-((t*(.05+rnd(i)*.07)+rnd(i+50))%1);e.textContent=PEMO[si];
  e.style.left=(rnd(i+9)*1040)+'px';e.style.top=(y*1180-80)+'px';e.style.opacity=.12+rnd(i+3)*.25;
  e.style.transform=`rotate(${Math.sin(t+i)*25}deg) scale(${.6+rnd(i+7)*.7})`;e.style.filter=`blur(${rnd(i+5)>.6?3:0}px)`;}

 {[['a',300,.95,0],['b',140,.75,1.3],['c',460,.75,2.4]].forEach(([p,x,s,ph],i)=>{const on=t>=[0.8,1.5,2.6][i];const o=on?hop(t,ph):{aL:8,aR:-8};place(p,x+(on?Math.sin(t*1.5+ph)*30:0),620-(i?40:0),s,i==2);pose(p,o);ears(p,on?Math.sin(t*10+ph)*15:0);
   $('ch_'+p).style.opacity=t>=[0,1.5,2.6][i]-.01?1:0;});$('cnt1').textContent=t<1.5?1:(t<2.6?2:(t<3.7?3:'3 + ещё 40'));}
 {const b=t>=4.4;for(let i=0;i<20;i++)$('eq'+i).style.height=(10+(b?Math.abs(Math.sin(t*7+i*1.3))*110:5))+'px';$('bpm2').textContent=b?'128 BPM':'0 BPM';
  const fl=b?Math.sin(t*16)*40:0;place('d',300,640,1.25,false);pose('d',b?{aL:60+Math.sin(t*8)*30,aR:-60-Math.sin(t*8)*30,bob:-Math.abs(Math.sin(t*8))*14,open:1,lL:Math.sin(t*8)*10,lR:-Math.sin(t*8)*10}:{aL:8,aR:-8});ears('d',fl);
  $('cl2').textContent='хлопков ушами: '+(b?Math.floor((t-4.4)*16/Math.PI):0);}
 {const n=t<10.6?0:Math.round(lerp(0,999,eo(seg(t,10.6,12.3))));$('go3').textContent=n>=999?'ВСЕ 🐰':n;const pt=t>=9.5;$('ball3').style.opacity=pt?1:0;$('ball3').style.transform=`rotate(${t*90}deg)`;
  [['e',300,1.0,0],['f',140,.8,1],['g',460,.8,2]].forEach(([p,x,s,ph],i)=>{const on=t>=[8.8,10.6,10.9][i];place(p,x,650-(i?20:0),s,i==2);$('ch_'+p).style.opacity=on?1:0;
   const q=Math.sin(t*8+ph);pose(p,pt?{aL:lerp(20,150,(q+1)/2),aR:-lerp(20,150,(1-q)/2),lL:q*14,lR:-q*14,bob:-Math.abs(q)*12,open:1}:{aL:8,aR:-150+Math.sin(t*12)*20});ears(p,q*20);});}
 {const g=t>=14.9;$('gl4').textContent=g?'качество: ГЛАМУРНО ✨':'качество: обычное';$('gl4').style.color=g?'#ffd60a':'#8e8e93';
  const q=Math.sin(t*7);place('h',300,660,1.35,false);pose('h',g?{aL:150,aR:-150+q*10,open:1,bob:-Math.abs(q)*10}:{aL:8,aR:58,hd:Math.sin(t*3)*5});ears('h',g?q*25:Math.sin(t*4)*6);
  $('ch_h').style.filter=g?`drop-shadow(0 0 ${25+10*Math.sin(t*8)}px #ffd60a)`:'none';
  if(g){const h=40+Math.sin(t*4)*10;$('h_s1').setAttribute('stop-color','#fff3b0');$('h_s2').setAttribute('stop-color',`hsl(${h},95%,55%)`);$('h_s3').setAttribute('stop-color','#d4a017');}
  for(let i=0;i<40;i++)$('s4_'+i).style.opacity=g?(.3+.7*Math.abs(Math.sin(t*4+i))):.06;}

 $('fade').style.opacity=seg(t,END[0],END[1]);
 let li=-1;LINES.forEach((L,i)=>{if(t>=L[0][1]-.15)li=i});
 $('sub').innerHTML=(li<0||t<SUBFROM)?'':LINES[li].map(([w,s])=>{const on=t>=s;const pp=on?Math.exp(-(t-s)*9):0;return `<span style="opacity:${on?1:.3};color:${on&&w.includes('гламурно')?'#ffd60a':'#fff'};transform:scale(${1+.14*pp}) translateY(${-6*pp}px)">${w}</span>`}).join('');
}
window.render=render;render(0);
</script></body></html>
