<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#000;font-family:Inter,"Apple Color Emoji",sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#0c0c10,#040406)}
#glow{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 58%,var(--g,#333) 0%,transparent 55%)}
#vign{position:absolute;inset:0;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.8) 100%);z-index:50}
#grain{position:absolute;inset:0;z-index:51;opacity:.07;background-image:repeating-radial-gradient(circle at 17% 32%,#fff 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
.pt{position:absolute;font-size:32px}
#sub{position:absolute;top:56px;left:0;right:0;text-align:center;font-weight:900;font-size:50px;color:#fff;z-index:40;text-shadow:0 4px 24px rgba(0,0,0,.7);padding:0 50px;line-height:1.12;text-transform:uppercase}
#sub span{display:inline-block;margin:0 10px}
.card{position:absolute;left:50%;top:57%;width:600px;height:690px;margin-left:-300px;margin-top:-345px;border-radius:52px;overflow:hidden;opacity:0;box-shadow:0 40px 120px rgba(0,0,0,.8),0 0 0 1.5px rgba(255,255,255,.08) inset;background:#111214;color:#fff}
.hdr{font-size:22px;font-weight:600;color:rgba(255,255,255,.55);padding:34px 40px 0}
.ttl{font-size:46px;font-weight:800;padding:6px 40px 0;letter-spacing:-1px}
.c{position:absolute;left:0;right:0;text-align:center}
.mono{font-family:'JetBrains Mono'}
.box{background:#2c2c2e;border-radius:24px;padding:20px 24px}
.bub{display:inline-block;padding:14px 22px;border-radius:28px;font-size:27px;font-weight:500}
.row{display:flex;align-items:center;gap:18px;background:#1c1c1e;border-radius:22px;padding:16px 22px;margin-bottom:12px;font-size:26px;font-weight:700}
.tg{width:84px;height:50px;border-radius:25px;background:#3a3a3c;position:relative;flex:none;margin-left:auto}.tg b{position:absolute;top:4px;left:4px;width:42px;height:42px;border-radius:50%;background:#fff}
#fade{position:absolute;inset:0;background:#000;opacity:0;z-index:70}
.ch{position:absolute;width:200px;height:300px;transform-origin:100px 290px;z-index:5}
</style></head><body><div id="stage"><div id="glow"></div><div id="pts"></div>

<div class="card" id="c1" style="background:#1c1c1e">
 <div class="hdr">Выбор</div><div class="ttl">Что выбрать?</div>
 <div style="position:absolute;left:30px;right:30px;top:170px">
  <div class="row" style="background:#2c2c2e">🛋 <span>Стабильность</span><span id="k1a" style="margin-left:auto;color:#0a84ff;font-weight:900">✓</span></div>
  <div class="row" id="dr1" style="background:#2c2c2e">✨ <span>Мечта</span><span id="k1b" style="margin-left:auto;color:#0a84ff;font-weight:900"></span></div></div>
 <div class="ch" data-p="a"></div>
</div>
<div class="card" id="c2" style="background:#0e1621">
 <div style="padding:24px 30px 14px;border-bottom:1px solid #1d2733;font-size:26px;font-weight:900">📣 Каналы · нытьё</div>
 <div id="wh2" style="position:absolute;left:24px;right:24px;top:90px"></div>
 <div class="ch" data-p="b"></div>
</div>
<div class="card" id="c3" style="background:#000">
 <div class="hdr">Банк · Кредиты</div>
 <div id="cr3" style="position:absolute;left:30px;right:30px;top:80px"></div>
 <div style="position:absolute;left:30px;right:30px;top:350px;display:flex;justify-content:space-between;font-size:24px;font-weight:800"><span>⏳ осталось</span><span id="dd3" class="mono" style="color:#ff9f0a">— дн.</span></div>
 <div style="position:absolute;left:30px;right:30px;top:390px;height:18px;border-radius:9px;background:#2c2c2e;overflow:hidden"><div id="db3" style="height:18px;background:#30d158;width:0"></div></div>
 <div class="ch" data-p="c"></div><div id="lp3" style="position:absolute;font-size:60px;z-index:6">💻</div>
</div>
<div class="card" id="c4" style="background:linear-gradient(180deg,#0a0f2a,#05060f 60%,#0a0a12)">
 <div id="city" style="position:absolute;left:0;right:0;top:120px;height:300px"></div>
 <div style="position:absolute;left:0;right:0;top:420px;bottom:0;background:linear-gradient(180deg,#14161e,#0a0b10)"></div>
 <div id="rk4" style="position:absolute;inset:0"></div>
 <div class="ch" data-p="d"></div>
 <div class="c" style="top:30px;font-size:30px;font-weight:900;letter-spacing:4px;color:#ffd60a">BIG CITY LIFE</div>
</div>
<div class="card" id="c5" style="background:#2a1d14">
 <div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,#3a2a1e 0 60px,#33251a 60px 62px)"></div>
 <div style="position:absolute;left:150px;top:180px;width:300px;height:360px;background:#ffe9a8;border:16px solid #f5f0e6;box-shadow:inset 0 0 60px rgba(255,160,0,.6)"></div>
 <div class="ch" data-p="e"></div>
 <div style="position:absolute;left:24px;top:24px;background:rgba(0,0,0,.6);border-radius:16px;padding:10px 16px;font-size:22px;font-weight:800">📍 Арбат</div>
 <div id="yl5" style="position:absolute;inset:0"></div>
</div>
<div class="card" id="c6" style="background:#000">
 <div id="go6" class="c" style="top:120px;font-size:84px;font-weight:900;color:#ff453a;font-family:'JetBrains Mono'">GAME OVER</div>
 <div id="lu6" class="c" style="top:120px;font-size:84px;font-weight:900;color:#30d158;font-family:'JetBrains Mono';opacity:0">LEVEL UP</div>
 <div id="no6" class="c" style="top:230px;font-size:26px;font-weight:800;color:#aeaeb2;opacity:0">проигрыш недоступен ✕</div>
 <div class="ch" data-p="f"></div>
</div>
<div id="sub"></div><div id="vign"></div><div id="grain"></div><div id="fade"></div></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eb=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pop=(t,s,k=8)=>t>=s?Math.exp(-(t-s)*k):0;
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const tog=(id,on)=>{const e=$(id);e.style.background=on?'#30d158':'#3a3a3c';e.firstElementChild.style.left=on?'38px':'4px'};
const LINES=[[["если", 0.0], ["это", 0.2], ["мечта,", 0.4], ["почему", 0.8], ["ты", 1.0], ["её", 1.3], ["не", 1.5], ["выбрал?", 1.7]], [["они", 2.1], ["ноют", 2.3], ["в", 2.6], ["телеграммах,", 2.7], ["что", 3.2], ["культура", 3.3], ["их", 3.8], ["не", 3.9], ["приняла", 4.0]], [["надо", 4.3], ["работать", 4.6], ["так,", 5.1], ["как", 5.4], ["будто", 5.5], ["до*уя", 5.8], ["кредитов", 6.2]], [["и", 6.7], ["у", 6.8], ["тебя", 6.9], ["пару", 7.2], ["месяцев,", 7.4], ["чтобы", 7.9], ["закрыть", 8.4]], [["а", 8.9], ["пока", 8.95], ["мелкие", 9.1], ["огни", 9.6], ["моего", 10.0], ["big", 10.3], ["city", 10.5], ["life", 10.8]], [["падают", 11.1], ["ракетами", 11.9], ["на", 12.5], ["мокрый", 12.6], ["асфальт", 12.9]], [["в", 13.8], ["окно", 13.85], ["на", 14.1], ["Арбате", 14.2], ["я", 14.6], ["буду", 14.8], ["это", 15.0], ["кричать", 15.2]], [["я", 15.7], ["не", 15.8], ["могу", 15.9], ["проиграть,", 16.1], ["не", 17.0], ["могу", 17.1], ["проиграть", 17.3]]];const SC=[[-0.3, 2.05], [2.05, 4.25], [4.25, 8.85], [8.85, 13.75], [13.75, 15.65], [15.65, 99]];const GLOW=["#3a3a5a", "#1d3a6a", "#5a3a0a", "#1d2a6a", "#5a1a1a", "#1a5c2e"];const PEMO=["💭", "😭", "💳", "🌃", "📢", "🏆"];const END=[18.45, 18.93];const SUBFROM=-9;
const CH=(p,hat,j1,j2)=>`<svg viewBox="0 0 200 300" width="200" height="300" style="overflow:visible">
<defs><linearGradient id="${p}_jg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${j1}" id="${p}_s1"/><stop offset=".5" stop-color="${j2}" id="${p}_s2"/><stop offset="1" stop-color="${j2}" id="${p}_s3"/></linearGradient></defs>
<g id="${p}_all">
<g id="${p}_legL"><rect x="77" y="205" width="21" height="70" rx="10" fill="#26262e"/><ellipse cx="84" cy="280" rx="19" ry="10" fill="#fff"/></g>
<g id="${p}_legR"><rect x="102" y="205" width="21" height="70" rx="10" fill="#26262e"/><ellipse cx="116" cy="280" rx="19" ry="10" fill="#fff"/></g>
<g id="${p}_armL"><rect x="40" y="128" width="21" height="72" rx="10" fill="url(#${p}_jg)"/><circle cx="50" cy="202" r="10" fill="#f2c6a0"/></g>
<rect x="54" y="116" width="92" height="104" rx="32" fill="url(#${p}_jg)"/>
<path d="M58 150 H142 M58 182 H142" stroke="rgba(0,0,0,.16)" stroke-width="4"/>
<path d="M78 120 Q100 152 122 120" fill="none" stroke="#ffd60a" stroke-width="5"/><circle cx="100" cy="146" r="7" fill="#ffd60a"/>
<g id="${p}_armR"><rect x="139" y="128" width="21" height="72" rx="10" fill="url(#${p}_jg)"/><circle cx="150" cy="202" r="10" fill="#f2c6a0"/></g>
<g id="${p}_head"><circle cx="100" cy="80" r="42" fill="#f2c6a0"/>
<path d="M56 66 Q58 26 100 26 Q142 26 144 66 L162 72 Q100 54 38 72 Z" fill="${hat}"/>
<rect x="64" y="74" width="32" height="19" rx="9" fill="#111"/><rect x="104" y="74" width="32" height="19" rx="9" fill="#111"/><rect x="94" y="78" width="12" height="4" fill="#111"/>
<rect x="70" y="77" width="8" height="4" rx="2" fill="rgba(255,255,255,.5)"/><rect x="110" y="77" width="8" height="4" rx="2" fill="rgba(255,255,255,.5)"/>
<path id="${p}_mouth" d="M88 104 Q100 112 112 104" fill="none" stroke="#7a3a2a" stroke-width="4" stroke-linecap="round"/></g>
</g></svg>`;
function pose(p,o){const R=(id,a,x,y)=>$(p+'_'+id).setAttribute('transform',`rotate(${a||0} ${x} ${y})`);
 R('armL',o.aL,50,135);R('armR',o.aR,150,135);R('legL',o.lL,88,210);R('legR',o.lR,112,210);R('head',o.hd,100,110);
 $(p+'_all').setAttribute('transform',`translate(0 ${o.bob||0})`);
 $(p+'_mouth').setAttribute('d',o.open?'M86 102 Q100 122 114 102 Z':'M88 104 Q100 112 112 104');$(p+'_mouth').setAttribute('fill',o.open?'#7a2a2a':'none');}
function place(p,x,y,s,flip,rot){const e=$('ch_'+p);e.style.left=(x-100)+'px';e.style.top=(y-290)+'px';e.style.transform=`scale(${s*(flip?-1:1)},${s}) rotate(${rot||0}deg)`;}
const run=(t,f)=>{const q=Math.sin(t*f);return {lL:q*38,lR:-q*38,aL:-q*45,aR:-q*45,bob:-Math.abs(Math.cos(t*f))*8}};
const walk=(t,f)=>{const q=Math.sin(t*f);return {lL:q*22,lR:-q*22,aL:-q*20,aR:-q*20,bob:-Math.abs(Math.cos(t*f))*4}};

(function(){document.querySelectorAll('.ch').forEach(e=>{const p=e.dataset.p;e.id='ch_'+p;e.innerHTML=CH(p,'#64d2ff','#ff8ac4','#ff2d78');});
 $('wh2').innerHTML=['культура нас не приняла 😭','никто не слушает 😢','индустрия закрыта 🙄'].map((m,i)=>`<div id="w2_${i}" style="margin-bottom:12px;opacity:0"><div class="bub" style="background:#182533;font-size:24px">${m}</div></div>`).join('');
 $('cr3').innerHTML=[1,2,3,4,5].map(i=>`<div id="c3_${i}" style="display:flex;justify-content:space-between;background:#1c1c1e;border-radius:14px;padding:8px 16px;margin-bottom:6px;font-size:20px;font-weight:700;opacity:0"><span>💳 Кредит #${i}</span><span class="mono" style="color:#ff453a">−${i*120} 000 ₽</span></div>`).join('');
 let c='';for(let i=0;i<14;i++){const h=80+rnd(i)*200;c+=`<div style="position:absolute;left:${i*44}px;bottom:0;width:40px;height:${h}px;background:#111628">`;for(let j=0;j<12;j++)c+=`<div class="win" style="position:absolute;left:${6+(j%3)*11}px;top:${10+Math.floor(j/3)*22}px;width:6px;height:10px;background:#ffd60a;opacity:${rnd(i*12+j)>.5?.9:.1}"></div>`;c+='</div>';}$('city').innerHTML=c;
 let r='';for(let i=0;i<8;i++)r+=`<div id="r4_${i}" style="position:absolute;font-size:44px;opacity:0">🚀</div>`;$('rk4').innerHTML=r;
 let y='';for(let i=0;i<8;i++)y+=`<div id="y5_${i}" style="position:absolute;font-size:${30+i%3*12}px;font-weight:900;color:#fff;opacity:0">!!!</div>`;$('yl5').innerHTML=y;})();

(function(){let p='';for(let i=0;i<20;i++)p+=`<div class="pt" id="p${i}"></div>`;$('pts').innerHTML=p;})();
function sceneIdx(t){for(let i=SC.length-1;i>=0;i--)if(t>=SC[i][0])return i;return 0}
function showCard(i,t){const [a,b]=SC[i];const el=$('c'+(i+1));
 const inP=eo(seg(t,a,a+.25)),outP=i<SC.length-1?seg(t,b-.1,b):0;const s=lerp(.86,1,eb(seg(t,a,a+.3)))*(1+outP*.06);
 el.style.opacity=inP*(1-outP);el.style.transform=`scale(${s}) translateY(${(1-inP)*40}px)`;el.style.filter=`blur(${(1-inP)*14+outP*10}px)`;}
const shake=(id,t,s,amp=10)=>{if(t>=s)$(id).style.transform+=` translateX(${Math.sin(t*90)*amp*pop(t,s,6)}px)`};
function render(t){
 for(let i=1;i<=SC.length;i++)$('c'+i).style.opacity=0;
 const si=sceneIdx(t);showCard(si,t);
 $('glow').style.setProperty('--g',GLOW[si]);
 let lastW=-9;LINES.flat().forEach(([w,s])=>{if(s<=t)lastW=s});const pulse=Math.exp(-(t-lastW)*7);
 $('glow').style.opacity=.5+.4*pulse;$('glow').style.transform=`scale(${1+.04*pulse})`;
 for(let i=0;i<20;i++){const e=$('p'+i);const y=1-((t*(.05+rnd(i)*.07)+rnd(i+50))%1);e.textContent=PEMO[si];
  e.style.left=(rnd(i+9)*1040)+'px';e.style.top=(y*1180-80)+'px';e.style.opacity=.12+rnd(i+3)*.25;
  e.style.transform=`rotate(${Math.sin(t+i)*25}deg) scale(${.6+rnd(i+7)*.7})`;e.style.filter=`blur(${rnd(i+5)>.6?3:0}px)`;}

 {const ch=t>=1.7;$('k1a').textContent=ch?'':'✓';$('k1b').textContent=ch?'✓':'';$('dr1').style.background=ch?'#3a1d6a':'#2c2c2e';
  place('a',300,670,1.15,false);pose('a',t<0.8?{aL:8,aR:-8}:(t<1.7?{aL:55,aR:-55,hd:12,open:1}:{aL:8,aR:-95,hd:-6}));}
 {[2.3,3.2,4.0].forEach((s,i)=>{$('w2_'+i).style.opacity=seg(t,s,s+.1);$('w2_'+i).style.transform=`scale(${eb(seg(t,s,s+.25))})`;$('w2_'+i).style.transformOrigin='left';});
  place('b',420,680,1.0,true);pose('b',t>=2.7?{aL:8,aR:145,hd:12}:{aL:8,aR:-8});}
 {[5.8,5.9,6.0,6.1,6.2].forEach((s,i)=>$('c3_'+(i+1)).style.opacity=seg(t,s,s+.05));const d=t<7.4?60:Math.round(lerp(60,0,seg(t,7.4,8.6)));$('dd3').textContent=(t<7.2?'—':d)+' дн.';
  $('db3').style.width=(seg(t,7.9,8.6)*100)+'%';const o=run(t,22);o.aR=-60;place('c',lerp(150,450,seg(t,4.6,8.6)),680,.9,false);pose('c',t>=4.6?o:{aL:8,aR:-8});
  const L=$('ch_c').getBoundingClientRect();$('lp3').style.left=(parseFloat($('ch_c').style.left)+150)+'px';$('lp3').style.top=(parseFloat($('ch_c').style.top)+180)+'px';$('lp3').style.opacity=t>=4.6?1:0;}
 {document.querySelectorAll('.win').forEach((w,i)=>{if(t>=9.6)w.style.opacity=Math.sin(t*3+i)>0.2?.95:.1;});
  for(let i=0;i<8;i++){const st=11.1+i*.25;const p=seg(t,st,st+.6);const e=$('r4_'+i);e.style.opacity=p>0&&p<1?1:0;e.style.left=(60+i*65)+'px';e.style.top=(80+p*380)+'px';e.style.transform='rotate(135deg)';}
  place('d',300,680,1.0,false);pose('d',t>=10.3?{aL:150,aR:-150,open:1,hd:-14}:{aL:8,aR:-8,hd:-12});}
 {place('e',300,560,1.0,false);const y=t>=15.2;pose('e',y?{aL:150+Math.sin(t*14)*10,aR:-150,open:1,hd:-10}:{aL:8,aR:-95});
  for(let i=0;i<8;i++){const ph=((t-15.2)*1.4+i/8)%1;const e=$('y5_'+i);e.style.opacity=y?1-ph:0;e.style.left=(300+Math.cos(i)*ph*260-20)+'px';e.style.top=(260-ph*200)+'px';}}
 {const u=t>=16.1;$('go6').style.opacity=u?0:1;$('go6').style.textDecoration=t>=15.9?'line-through':'none';$('lu6').style.opacity=seg(t,16.1,16.2);$('no6').style.opacity=seg(t,16.1,16.25);$('lu6').style.transform=`scale(${1+.3*pop(t,16.1,5)+.2*pop(t,17.3,5)})`;
  place('f',300,680,1.2,false);pose('f',u?{aL:8,aR:-165+Math.sin(t*16)*12,open:1,bob:-Math.max(pop(t,16.1,5),pop(t,17.3,5))*50}:{aL:-14,aR:14});
  if(t>=17.3){[1,2,3].forEach((n,ix)=>$('f_s'+n).setAttribute('stop-color',`hsl(${(t*240+ix*120)%360},100%,62%)`));$('ch_f').style.filter='drop-shadow(0 0 25px #30d158)';}}

 $('fade').style.opacity=seg(t,END[0],END[1]);
 let li=-1;LINES.forEach((L,i)=>{if(t>=L[0][1]-.15)li=i});
 $('sub').innerHTML=(li<0||t<SUBFROM)?'':LINES[li].map(([w,s])=>{const on=t>=s;const pp=on?Math.exp(-(t-s)*9):0;return `<span style="opacity:${on?1:.3};color:${on&&w.includes('@@@')?'#ff453a':'#fff'};transform:scale(${1+.14*pp}) translateY(${-6*pp}px)">${w}</span>`}).join('');
}
window.render=render;render(0);
</script></body></html>
