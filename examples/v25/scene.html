<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#000;font-family:Inter,"Apple Color Emoji",sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#120812,#050206)}
#glow{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 58%,var(--g,#333) 0%,transparent 55%)}
#vign{position:absolute;inset:0;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.8) 100%);z-index:50}
#grain{position:absolute;inset:0;z-index:51;opacity:.07;background-image:repeating-radial-gradient(circle at 17% 32%,#fff 0 1px,transparent 1px 4px);mix-blend-mode:overlay}
.pt{position:absolute;font-size:32px}
#sub{position:absolute;top:56px;left:0;right:0;text-align:center;font-weight:900;font-size:50px;color:#fff;z-index:40;text-shadow:0 4px 24px rgba(0,0,0,.7);padding:0 50px;line-height:1.12;text-transform:uppercase}
#sub span{display:inline-block;margin:0 10px}
.card{position:absolute;left:50%;top:57%;width:600px;height:690px;margin-left:-300px;margin-top:-345px;border-radius:52px;overflow:hidden;opacity:0;box-shadow:0 40px 120px rgba(0,0,0,.8),0 0 0 1.5px rgba(255,255,255,.08) inset;background:#111214;color:#fff}
.hdr{font-size:22px;font-weight:600;color:rgba(255,255,255,.55);padding:34px 40px 0}
.ttl{font-size:46px;font-weight:800;padding:6px 40px 0;letter-spacing:-1px}
.c{position:absolute;left:0;right:0;text-align:center}
.mono{font-family:'JetBrains Mono'}
.box{background:#2c2c2e;border-radius:24px;padding:20px 24px}
.bub{display:inline-block;padding:14px 22px;border-radius:28px;font-size:27px;font-weight:500}
.row{display:flex;align-items:center;gap:18px;background:#1c1c1e;border-radius:22px;padding:16px 22px;margin-bottom:12px;font-size:26px;font-weight:700}
.tg{width:84px;height:50px;border-radius:25px;background:#3a3a3c;position:relative;flex:none;margin-left:auto}.tg b{position:absolute;top:4px;left:4px;width:42px;height:42px;border-radius:50%;background:#fff}
#fade{position:absolute;inset:0;background:#000;opacity:0;z-index:70}
.ch{position:absolute;width:200px;height:300px;transform-origin:100px 290px;z-index:5}.bl{position:absolute;font-size:56px;z-index:6}
</style></head><body><div id="stage"><div id="glow"></div><div id="pts"></div>

<div class="card" id="c1" style="background:#000">
 <div class="hdr" style="color:#ff375f">❤ Пульс</div>
 <div id="bpm1" class="mono" style="position:absolute;right:40px;top:30px;font-size:48px;font-weight:800">72</div>
 <svg width="600" height="160" style="position:absolute;top:110px;left:0"><path id="ecg1" fill="none" stroke="#ff375f" stroke-width="5"/></svg>
 <div id="hb1" style="position:absolute;left:300px;top:420px;font-size:90px;z-index:7;margin:-45px 0 0 -45px">❤️</div>
 <div class="ch" data-p="a"></div>
</div>
<div class="card" id="c2" style="background:linear-gradient(180deg,#1a1430,#07050e)">
 <div id="n2" style="position:absolute;left:24px;right:24px;top:40px;background:rgba(60,60,64,.9);border-radius:24px;padding:16px 20px;display:flex;gap:14px;align-items:center;opacity:0">
  <div style="width:56px;height:56px;border-radius:14px;background:#ff2d55;display:flex;align-items:center;justify-content:center;font-size:30px">💘</div><div><div style="font-size:24px;font-weight:900">Входящие</div><div style="font-size:20px;color:#d1d1d6;font-weight:600">пули · летят к вам</div></div></div>
 <div class="ch" data-p="b"></div>
</div>
<div class="card" id="c3" style="background:radial-gradient(circle at 50% 70%,#0e2a16,#020804)">
 <svg width="600" height="690" style="position:absolute;inset:0" id="rad3"></svg>
 <div id="bul3"></div>
 <div class="ch" data-p="c"></div>
 <div style="position:absolute;left:24px;right:24px;top:24px;background:rgba(0,0,0,.5);border-radius:22px;padding:14px 20px;display:flex;justify-content:space-between;font-size:24px;font-weight:800;color:#30d158"><span>📡 Радар · пули</span><span id="cn3" class="mono">0</span></div>
</div>
<div class="card" id="c4" style="background:#1c0a10">
 <div id="hit4" class="bl" style="font-size:80px">💘</div>
 <div id="bm4" style="position:absolute;left:250px;top:330px;font-size:160px;opacity:0;z-index:7">💥</div>
 <div class="ch" data-p="d"></div>
 <div id="t4" class="c" style="top:60px;font-size:40px;font-weight:900;color:#ff2d55;opacity:0">ПОПАДАНИЕ 💘</div>
</div>
<div class="card" id="c5" style="background:#1c1c1e">
 <div class="hdr">Поделиться</div><div class="ttl">Раздели</div>
 <div id="hL" style="position:absolute;left:300px;top:200px;width:80px;height:160px;overflow:hidden;margin-left:-80px"><div style="width:160px;font-size:140px;line-height:160px;text-align:center">❤️</div></div>
 <div id="hR" style="position:absolute;left:300px;top:200px;width:80px;height:160px;overflow:hidden"><div style="width:160px;margin-left:-80px;font-size:140px;line-height:160px;text-align:center">❤️</div></div>
 <div class="ch" data-p="e"></div><div class="ch" data-p="f"></div>
 <div id="t5" class="c" style="bottom:30px;font-size:30px;font-weight:900;color:#ff2d55;opacity:0">50 / 50 💞</div>
</div>
<div id="sub"></div><div id="vign"></div><div id="grain"></div><div id="fade"></div></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eb=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const pop=(t,s,k=8)=>t>=s?Math.exp(-(t-s)*k):0;
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const tog=(id,on)=>{const e=$(id);e.style.background=on?'#30d158':'#3a3a3c';e.firstElementChild.style.left=on?'38px':'4px'};
const LINES=[[["и", 0.25], ["посмотри,", 0.75], ["как", 1.25], ["сердце", 1.75], ["бьётся", 2.5]], [["пули", 4.25]], [["пули", 6.0], ["летят,", 6.25], ["летят", 8.25], ["в", 9.5], ["сторону", 11.0], ["мою", 12.25]], [["пули", 13.25]], [["пули", 15.0], ["твоей", 15.75], ["любви", 16.25], ["раздели", 16.75]]];const SC=[[-0.3, 4.15], [4.15, 5.95], [5.95, 13.15], [13.15, 14.95], [14.95, 99]];const GLOW=["#6a0a2a", "#3a1d5a", "#5a0a1a", "#7a0a2a", "#7a1f5a"];const PEMO=["💓", "💘", "💘", "💥", "💞"];const END=[17.45, 17.88];const SUBFROM=-9;
const CH=(p,hat,j1,j2)=>`<svg viewBox="0 0 200 300" width="200" height="300" style="overflow:visible">
<defs><linearGradient id="${p}_jg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${j1}" id="${p}_s1"/><stop offset=".5" stop-color="${j2}" id="${p}_s2"/><stop offset="1" stop-color="${j2}" id="${p}_s3"/></linearGradient></defs>
<g id="${p}_all">
<g id="${p}_legL"><rect x="77" y="205" width="21" height="70" rx="10" fill="#26262e"/><ellipse cx="84" cy="280" rx="19" ry="10" fill="#fff"/></g>
<g id="${p}_legR"><rect x="102" y="205" width="21" height="70" rx="10" fill="#26262e"/><ellipse cx="116" cy="280" rx="19" ry="10" fill="#fff"/></g>
<g id="${p}_armL"><rect x="40" y="128" width="21" height="72" rx="10" fill="url(#${p}_jg)"/><circle cx="50" cy="202" r="10" fill="#f2c6a0"/></g>
<rect x="54" y="116" width="92" height="104" rx="32" fill="url(#${p}_jg)"/>
<path d="M58 150 H142 M58 182 H142" stroke="rgba(0,0,0,.16)" stroke-width="4"/>
<path d="M78 120 Q100 152 122 120" fill="none" stroke="#ffd60a" stroke-width="5"/><circle cx="100" cy="146" r="7" fill="#ffd60a"/>
<g id="${p}_armR"><rect x="139" y="128" width="21" height="72" rx="10" fill="url(#${p}_jg)"/><circle cx="150" cy="202" r="10" fill="#f2c6a0"/></g>
<g id="${p}_head"><circle cx="100" cy="80" r="42" fill="#f2c6a0"/>
<path d="M56 66 Q58 26 100 26 Q142 26 144 66 L162 72 Q100 54 38 72 Z" fill="${hat}"/>
<rect x="64" y="74" width="32" height="19" rx="9" fill="#111"/><rect x="104" y="74" width="32" height="19" rx="9" fill="#111"/><rect x="94" y="78" width="12" height="4" fill="#111"/>
<rect x="70" y="77" width="8" height="4" rx="2" fill="rgba(255,255,255,.5)"/><rect x="110" y="77" width="8" height="4" rx="2" fill="rgba(255,255,255,.5)"/>
<path id="${p}_mouth" d="M88 104 Q100 112 112 104" fill="none" stroke="#7a3a2a" stroke-width="4" stroke-linecap="round"/></g>
</g></svg>`;
function pose(p,o){const R=(id,a,x,y)=>$(p+'_'+id).setAttribute('transform',`rotate(${a||0} ${x} ${y})`);
 R('armL',o.aL,50,135);R('armR',o.aR,150,135);R('legL',o.lL,88,210);R('legR',o.lR,112,210);R('head',o.hd,100,110);
 $(p+'_all').setAttribute('transform',`translate(0 ${o.bob||0})`);
 $(p+'_mouth').setAttribute('d',o.open?'M86 102 Q100 122 114 102 Z':'M88 104 Q100 112 112 104');$(p+'_mouth').setAttribute('fill',o.open?'#7a2a2a':'none');}
function place(p,x,y,s,flip,rot){const e=$('ch_'+p);e.style.left=(x-100)+'px';e.style.top=(y-290)+'px';e.style.transform=`scale(${s*(flip?-1:1)},${s}) rotate(${rot||0}deg)`;}
const run=(t,f)=>{const q=Math.sin(t*f);return {lL:q*38,lR:-q*38,aL:-q*45,aR:-q*45,bob:-Math.abs(Math.cos(t*f))*8}};
const walk=(t,f)=>{const q=Math.sin(t*f);return {lL:q*22,lR:-q*22,aL:-q*20,aR:-q*20,bob:-Math.abs(Math.cos(t*f))*4}};

const GIRL=['#ff9ac1','#f3e8ff','#b38cff'];
(function(){document.querySelectorAll('.ch').forEach(e=>{const p=e.dataset.p;e.id='ch_'+p;e.innerHTML=CH(p,...(p=='f'?GIRL:['#64d2ff','#ff8ac4','#ff2d78']));});
 let b='';for(let i=0;i<8;i++)b+=`<div class="bl" id="b3_${i}">💘</div>`;$('bul3').innerHTML=b;
 let r='';for(let k=1;k<5;k++)r+=`<circle cx="300" cy="500" r="${k*90}" fill="none" stroke="rgba(48,209,88,.25)" stroke-width="2"/>`;$('rad3').innerHTML=r+'<line id="sw3" x1="300" y1="500" x2="300" y2="140" stroke="rgba(48,209,88,.6)" stroke-width="4"/>';})();

(function(){let p='';for(let i=0;i<20;i++)p+=`<div class="pt" id="p${i}"></div>`;$('pts').innerHTML=p;})();
function sceneIdx(t){for(let i=SC.length-1;i>=0;i--)if(t>=SC[i][0])return i;return 0}
function showCard(i,t){const [a,b]=SC[i];const el=$('c'+(i+1));
 const inP=eo(seg(t,a,a+.25)),outP=i<SC.length-1?seg(t,b-.1,b):0;const s=lerp(.86,1,eb(seg(t,a,a+.3)))*(1+outP*.06);
 el.style.opacity=inP*(1-outP);el.style.transform=`scale(${s}) translateY(${(1-inP)*40}px)`;el.style.filter=`blur(${(1-inP)*14+outP*10}px)`;}
const shake=(id,t,s,amp=10)=>{if(t>=s)$(id).style.transform+=` translateX(${Math.sin(t*90)*amp*pop(t,s,6)}px)`};
function render(t){
 for(let i=1;i<=SC.length;i++)$('c'+i).style.opacity=0;
 const si=sceneIdx(t);showCard(si,t);
 $('glow').style.setProperty('--g',GLOW[si]);
 let lastW=-9;LINES.flat().forEach(([w,s])=>{if(s<=t)lastW=s});const pulse=Math.exp(-(t-lastW)*7);
 $('glow').style.opacity=.5+.4*pulse;$('glow').style.transform=`scale(${1+.04*pulse})`;
 for(let i=0;i<20;i++){const e=$('p'+i);const y=1-((t*(.05+rnd(i)*.07)+rnd(i+50))%1);e.textContent=PEMO[si];
  e.style.left=(rnd(i+9)*1040)+'px';e.style.top=(y*1180-80)+'px';e.style.opacity=.12+rnd(i+3)*.25;
  e.style.transform=`rotate(${Math.sin(t+i)*25}deg) scale(${.6+rnd(i+7)*.7})`;e.style.filter=`blur(${rnd(i+5)>.6?3:0}px)`;}

 {const b=Math.round(lerp(72,140,seg(t,1.75,3.0)));$('bpm1').textContent=b;let d='M0 80';for(let x=0;x<=600;x+=4){const ph=((x/600*3+t*b/60)%1);let v=0;if(ph>.4&&ph<.44)v=-60;else if(ph>.44&&ph<.47)v=40;d+=` L${x} ${80+v}`}$('ecg1').setAttribute('d',d);
  const beat=Math.pow(Math.abs(Math.sin(t*b/60*Math.PI)),8);$('hb1').style.transform=`scale(${1+beat*.35})`;$('hb1').style.left=(300+20)+'px';$('hb1').style.top=(460)+'px';
  place('a',300,660,1.2,false);pose('a',t>=0.75?{aL:-58,aR:58,hd:6}:{aL:8,aR:-8});}
 {$('n2').style.opacity=seg(t,4.25,4.4);$('n2').style.transform=`translateY(${(1-eb(seg(t,4.25,4.5)))*-40}px)`;place('b',300,660,1.25,false);
  pose('b',t>=4.25?{aL:55,aR:-55,hd:-14,open:1,bob:-pop(t,4.25,6)*40}:{aL:8,aR:-8});}
 {$('sw3').setAttribute('transform',`rotate(${t*180} 300 500)`);let n=0;const T=[6.0,6.25,7.2,8.25,9.0,9.5,11.0,12.25];
  T.forEach((s,i)=>{const e=$('b3_'+i);const p=seg(t,s,s+.9);const from=i%2?[-60,150+i*40]:[620,120+i*40];e.style.left=lerp(from[0],300,p)+'px';e.style.top=lerp(from[1],470,p)+'px';e.style.opacity=p>0&&p<1?1:0;e.style.transform=`scaleX(${i%2?1:-1})`;if(t>=s)n++;});
  $('cn3').textContent=n;const dodge=Math.sin(t*6);place('c',300+dodge*30,640,1.0,false,dodge*20);pose('c',{aL:120+Math.sin(t*14)*30,aR:-120-Math.sin(t*14)*30,open:1,hd:-dodge*10,lL:dodge*15,lR:-dodge*15});}
 {const p=seg(t,13.25,13.6);$('hit4').style.left=lerp(620,300,p)+'px';$('hit4').style.top='380px';$('hit4').style.opacity=p<1&&t>=13.25?1:0;$('bm4').style.opacity=t>=13.6?1-seg(t,13.9,14.3):0;
  $('t4').style.opacity=seg(t,13.6,13.7);const h=t>=13.6;place('d',300,660,1.2,false,h?-eo(seg(t,13.6,14.0))*25:0);pose('d',h?{aL:-58,aR:58,hd:-20,open:1}:{aL:8,aR:-8});if(si==3)shake('c4',t,13.6,12);}
 {const s=t>=16.75?eo(seg(t,16.75,17.1)):0;$('hL').style.transform=`translateX(${-s*150}px) rotate(${-s*10}deg)`;$('hR').style.transform=`translateX(${s*150}px) rotate(${s*10}deg)`;$('t5').style.opacity=seg(t,16.9,17.0);
  place('e',150,660,1.0,false);place('f',450,660,1.0,true);const o=t>=16.75?{aL:8,aR:-150,open:1}:{aL:8,aR:-95};pose('e',o);pose('f',o);}

 $('fade').style.opacity=seg(t,END[0],END[1]);
 let li=-1;LINES.forEach((L,i)=>{if(t>=L[0][1]-.15)li=i});
 $('sub').innerHTML=(li<0||t<SUBFROM)?'':LINES[li].map(([w,s])=>{const on=t>=s;const pp=on?Math.exp(-(t-s)*9):0;return `<span style="opacity:${on?1:.3};color:${on&&w.includes('любви')?'#ff2d55':'#fff'};transform:scale(${1+.14*pp}) translateY(${-6*pp}px)">${w}</span>`}).join('');
}
window.render=render;render(0);
</script></body></html>
